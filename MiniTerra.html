<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MiniTerra</title>
<style>
  :root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  html, body { height: 100%; margin: 0; background: #111; overflow: hidden; font-family: system-ui, sans-serif; }
  canvas { display: block; width: 100%; height: 100%; }
  #hotbar { position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 4px; }
  .slot { width: 48px; height: 48px; border: 3px solid #555; background: rgba(0,0,0,.55); color: #fff; font-size: 12px;
          display: flex; align-items: flex-end; justify-content: flex-end; padding: 2px 4px; box-sizing: border-box; position: relative; }
  .slot.sel { border-color: #ffd54a; }
  .slot svg { position: absolute; left: 4px; top: 4px; width: 34px; height: 34px; }
  #name { position: fixed; bottom: 66px; left: 0; right: 0; text-align: center; color: #fff; font-size: 13px; text-shadow: 0 1px 3px #000; pointer-events: none; }
  .slot b { position: relative; }
  #help { position: fixed; top: 10px; left: 10px; color: #fff; background: rgba(0,0,0,.5); padding: 8px 10px; border-radius: 8px; font-size: 12px; line-height: 1.5; }
  #debug { position: fixed; left: 10px; top: 96px; width: 270px; max-height: calc(100% - 170px); overflow-y: auto; background: rgba(0,0,0,.88); color: #fff; font-size: 12px; padding: 10px; border-radius: 8px; display: none; z-index: 5; }
  #debug h4 { margin: 10px 0 4px; color: #ffd54a; }
  #debug .drow { margin: 4px 0; }
  #debug button { margin: 2px 2px 2px 0; padding: 4px 8px; cursor: pointer; }
  #debug input[type=range] { width: 100%; }
  .slot em { position: absolute; left: 3px; top: 1px; font-size: 10px; font-style: normal; color: #bbb; }
  .slot u { position: absolute; left: 4px; bottom: 3px; height: 3px; background: #7ee787; }
  .slot.pick { border-color: #4fc3f7; }
  .slot b { text-shadow: 0 1px 2px #000; }
  #name { bottom: 120px; left: calc(50% - 232px); right: auto; text-align: left; font-size: 12px; line-height: 1.4; }   /* tool info: above the left side of the hotbar */
  #name b { font-size: 14px; } #name small { color: #ccc; display: block; }
  #inv { position: fixed; inset: 0; background: rgba(8,10,16,.82); display: none; align-items: center; justify-content: center; z-index: 8; }
  .invbox { display: flex; flex-wrap: wrap; gap: 24px; background: #2b2f3a; border: 3px solid #555c6e; border-radius: 12px; padding: 18px; color: #fff; max-height: 86vh; max-width: 96vw; box-sizing: border-box; overflow: auto; }
  .invbox h3 { margin: 0 0 8px; } .invbox small { font-weight: normal; font-size: 12px; }
  #invgrid { display: grid; grid-template-columns: repeat(9, 48px); gap: 4px; }
  #invgrid .gap { grid-column: 1 / -1; height: 10px; }
  #invinfo { margin-top: 10px; font-size: 12px; min-height: 52px; color: #ddd; line-height: 1.5; }
  .invright { width: min(340px, 86vw); flex: 1 1 300px; overflow-y: auto; max-height: calc(86vh - 40px); }
  #craft summary { cursor: pointer; font-weight: bold; padding: 5px 8px; background: #3a3f4d; border-radius: 4px; margin-top: 4px; }
  #craft details details { margin-left: 14px; }
  .rec { display: flex; align-items: center; gap: 8px; padding: 5px 4px; border-bottom: 1px solid #444; user-select: none; }
  .rec.can { cursor: pointer; } .rec.can:hover { background: #3f6b4a; } .rec.off { opacity: .7; }
  .rec .go { color: #7ee787; font-weight: bold; font-size: 12px; min-width: 38px; text-align: right; }
  .rec .ic { width: 30px; height: 30px; flex: none; } .rec .txt { flex: 1; font-size: 12px; line-height: 1.4; }
  .rec button { padding: 5px 10px; cursor: pointer; }
  .have { color: #7ee787; } .lack { color: #ff7b72; } .rec i { color: #ffd54a; font-style: normal; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hotbar"></div>
<div id="name"></div>
<div id="inv"><div class="invbox">
  <div class="invleft"><h3>Inventory</h3><div id="invgrid"></div><div id="invinfo">Click an item, then click another slot to move it.</div></div>
  <div class="invright"><h3>Crafting <small id="benchstat"></small></h3><div id="craft"></div></div>
</div></div>
<div id="help"><b>A/D</b> move &nbsp;<b>W/Space</b> jump &nbsp;<b>Shift</b> sprint<br><b>Hold left-click</b> mine &nbsp;<b>Right-click</b> place<br><b>1-9 / wheel</b> select &nbsp;<b>E</b> inventory &amp; crafting &nbsp;<b>`</b> debug menu</div>

<script>
/* =====================================================================
   ★ EDIT THIS SECTION TO CUSTOMIZE THE GAME ★
   ===================================================================== */

// General settings
const CONFIG = {
  tileSize: 28,        // pixels per block on screen
  loadRadius: 96,      // the world is ENDLESS left and right! This is how far around you it gets generated
  biomeScale: 0.004,   // biome size: SMALLER number = BIGGER biomes
  spawnForest: 60,     // the area around the start is always forest (blocks from the start)
  worldDepth: 500,     // how many blocks deep the world goes below the surface (it is endless sideways)
  surfaceLevel: 170,   // average ground height. Bigger = more room above ground for sky islands and clouds
  gravity: 0.03,
  moveSpeed: 0.15,
  jumpPower: 0.42,
  reach: 6,            // how far (in blocks) you can mine/place
  lineOfSight: true,   // true = you can't mine/place through solid blocks (false = x-ray mining)
  dayLength: 600,      // real seconds for one full day+night cycle (600 = 10 minutes)
  dayNightCycle: true, // false = it's always daytime on the surface
  nightBrightness: 0.3,// how bright the surface is at night (0 = black, 1 = same as day)
  // --- Health & stamina (values are per frame, 60 frames = 1 second) ---
  maxHealth: 100,
  maxHunger: 20,       // hunger points (shown as 10 drumsticks)
  hungerBase: 0.0025,  // hunger 'exhaustion' gained per frame just from living (4 exhaustion = 1 hunger point)
  hungerSprint: 0.02,  // extra exhaustion per frame while sprinting
  hungerMine: 0.1,     // exhaustion per block mined
  regenHunger: 18,     // you only heal naturally while hunger is at least this high
  regenExhaust: 0.2,   // healing makes you hungry (exhaustion per health point healed)
  sprintHunger: 6,     // you can't sprint when hunger is this low or lower
  starveDamage: 2,     // health lost every 4 seconds when hunger is empty
  healthRegen: 0.04,   // health regained per frame when not hurt recently (0.04 = ~2.4 per second)
  regenDelay: 240,     // frames to wait after taking damage before healing starts (240 = 4 sec)
  safeFall: 7,         // blocks you can fall without taking damage
  fallDamage: 6,       // damage for every block fallen beyond safeFall
  maxStamina: 100,
  sprintSpeed: 1.7,    // speed multiplier while sprinting (hold Shift)
  sprintDrain: 0.35,   // stamina used per frame while sprinting (0.35 = ~4.7 sec of sprint)
  staminaRegen: 0.3,   // stamina regained per frame when not sprinting
  staminaDelay: 30,    // frames to wait after sprinting before stamina refills
  staminaRecover: 20,  // after running out, you can't sprint again until stamina reaches this
  benchRange: 6,       // how close (in blocks) you must be to a Crafting Bench to craft tools & weapons
  fistDamage: 4,       // damage when you punch with no weapon
  startItems: { dirt: 10, torch: 5, apple: 3 },   // what you start with
  deepStoneDepth: 45,  // below this many blocks underground, stone turns into darker 'deepstone'
  oreDepthBoost: 0.02, // ores get this much more common per block of depth (0 = no change)
  caveSize: 0.62,      // big caverns: LOWER = bigger caves (0.5 = huge, 0.7 = tiny)
  tunnelWidth: 0.03,   // winding tunnels: higher = wider, 0 = no tunnels
  // --- Sky, ocean, weather, enemies ---
  islandChance: 0.75,  // chance that each 100-block-wide slot of world has a floating sky island
  islandBands: [[28, 50], [55, 95], [100, 140]],  // how far above the ground islands float: low, middle and high bands (min, max blocks)
  oceanThreshold: 0.62, // higher = fewer oceans
  oceanDepth: 14,      // how deep the ocean floor gets
  seaOffset: 4,        // sea level, in blocks below the average ground level
  weatherMin: 3600, weatherMax: 9000,   // frames each weather lasts (3600 = 1 minute)
  enemyDepthScale: 300,// enemies get tougher with depth: +100% health per this many blocks
  oreBoostMax: 4,      // ores never get more than this many times as common as their base chance
  // --- Water & lava ---
  lakeChance: 0.6,     // chance that each 48-block-wide section of world gets a lake
  lakeWidth: [5, 10],  // lake half-width range (blocks)
  lakeDepth: 4,        // how deep lakes get in the middle
  poolMinDepth: 12,    // cave pools only appear this far below the surface
  poolStart: 0.3,      // chance a cave floor gets a pool (higher = more pools)
  poolContinue: 0.65,  // chance a pool gets another layer (higher = deeper pools)
  lavaDepth: 100,      // below this depth, cave pools are LAVA instead of water
  liquidSlow: 0.55,    // movement speed multiplier while in water/lava
  liquidMineSlow: 0.5, // mining speed multiplier while you're in liquid (0.5 = takes double the time)
  flowEvery: 6,        // water spreads one block every this many frames (lower = faster)
  lavaFlowEvery: 2,    // lava flows this many times slower than water (2 = half speed)
  flowRadius: [60, 40],// liquids only flow this close to you (x, y blocks) to keep the game fast
  halfFlowBelow: 5,    // flowing liquid with a level below this (water flows 7 down to 1) is drawn as a half block
  // --- Oxygen ---
  maxOxygen: 600,      // frames of air while your head is underwater (600 = 10 sec)
  oxygenRefill: 8,     // oxygen regained per frame when your head is out of the water
  drownDamage: 0.1,    // health lost per frame once you run out of air
  // --- Lighting ---
  darkDepth: 300,      // blocks underground where it reaches maximum darkness
  depthDarkness: 0.85, // how dark deep areas get (0 = never, 1 = pitch black)
  minLight: 0.04,      // darkest allowed brightness (0 = totally black caves)
  playerLight: 8,      // glow radius around you in blocks (0 = no glow)
  lightAirCost: 0.05,  // how fast daylight fades going through open air/caves
  lightSolidCost: 0.12,// how fast daylight fades going through solid blocks
};

// BLOCKS: add a new block by adding a line here!
//  color    = how it looks
//  hardness = how long to mine (higher = slower, Infinity = unbreakable)
//  solid    = can you walk through it? (default true)
//  drops    = which ITEM you get when you break it
//  ore      = (optional) generates underground: chance (0-1) and minDepth below the surface
const BLOCKS = {
  air:     { color: null, solid: false, hardness: 0 },
  grass:   { color: '#4caf50', hardness: 20, drops: 'dirt' },
  dirt:    { color: '#8b5a2b', hardness: 20, drops: 'dirt' },
  stone:   { color: '#7d7d7d', hardness: 50, drops: 'stone' },
  deepstone: { color: '#4a4a58', hardness: 80, drops: 'stone' },
  wood:    { color: '#6d4c2a', hardness: 30, drops: 'wood', solid: false, chop: true },   // tree trunk (walk through)
  leaves:  { color: '#2e7d32', hardness: 8,  drops: 'apple', dropChance: 0.12, solid: false, chop: true },
  planks:  { color: '#c8954f', hardness: 30, drops: 'planks', chop: true },   // chop: true = axes mine it faster
  // Ores: 'chance' = base odds per block, 'minDepth' = blocks below the surface where it starts.
  // Chance grows with depth (see oreDepthBoost). Rarer ores start deeper.
  coal:    { color: '#222222', hardness: 60,  drops: 'coal',    ore: { chance: 0.04,  minDepth: 8 } },
  iron:    { color: '#d9a679', hardness: 90,  drops: 'iron',    ore: { chance: 0.03,  minDepth: 15 } },
  gold:    { color: '#ffd700', hardness: 120, drops: 'gold',    ore: { chance: 0.015, minDepth: 40 } },
  diamond: { color: '#40e0ff', hardness: 160, drops: 'diamond', ore: { chance: 0.008, minDepth: 70 } },
  ruby:    { color: '#ff2255', hardness: 200, drops: 'ruby',    ore: { chance: 0.005, minDepth: 100 } },
  mythril: { color: '#b266ff', hardness: 280, drops: 'mythril', ore: { chance: 0.003, minDepth: 130 } },
  // Crafting bench: tools & weapons can only be crafted near one (needsFloor = must sit on the ground)
  crafting_bench: { color: '#b07a3a', shape: 'bench', solid: false, hardness: 20, drops: 'crafting_bench', needsFloor: true, chop: true },
  // Biome blocks
  sand:      { color: '#e6d28a', hardness: 10,  drops: 'sand' },
  sandstone: { color: '#c9a95f', hardness: 40,  drops: 'sandstone' },
  snow:      { color: '#f2f7ff', hardness: 10,  drops: 'snow' },
  ice:       { color: '#9fd8ff', hardness: 30,  drops: 'ice' },
  fungus:    { color: '#9b59d0', hardness: 25,  drops: 'fungus', emit: 0.3 },     // glows!
  obsidian:  { color: '#2a1d45', hardness: 220, drops: 'obsidian' },              // made when water touches lava
  cactus:    { color: '#3f9f4a', solid: false, hardness: 10, drops: null, chop: true },
  pine:      { color: '#1b5e3b', solid: false, hardness: 8,  drops: null, chop: true },
  // Sky island blocks
  skygrass:   { color: '#8fe0a0', hardness: 10, drops: 'dirt' },
  cloudstone: { color: '#dfe8f5', hardness: 25, drops: 'cloudstone' },
  crystal:    { color: '#8fe3ff', hardness: 40, drops: 'crystal', emit: 0.45 },          // glows!
  sunstone:   { color: '#f2d37c', hardness: 45, drops: 'sunstone' },
  blossom:    { color: '#f6b8d2', solid: false, hardness: 8, drops: null, chop: true },   // cherry-blossom leaves
  // Liquids: liquid = swimmable, damage = health lost per frame, emit = glows (0-1),
  //          decay = how quickly it thins out as it flows (1 = flows far, 2 = flows half as far)
  water:   { color: 'rgba(40,110,230,0.65)', solid: false, liquid: true, hardness: Infinity, decay: 1 },
  lava:    { color: '#ff5a14', solid: false, liquid: true, hardness: Infinity, damage: 0.6, emit: 0.55, decay: 2 },
  // Torch: emit = how much light it gives off, needsSupport = must be placed next to a block or wall
  torch:   { color: '#ffb300', shape: 'torch', solid: false, hardness: 1, drops: 'torch', emit: 0.85, needsSupport: true },
  bedrock: { color: '#1a1a1a', hardness: Infinity },
};

// ITEMS: things in your inventory.
//  block = placing it puts this block in the world
//  tool  = mining speed multiplier (bigger = faster)
// (Color is taken from the block automatically, or set it with color:)
const ITEMS = {
  dirt:   { block: 'dirt' },
  stone:  { block: 'stone' },
  wood:   { block: 'wood' },
  planks: { block: 'planks' },
  crafting_bench: { block: 'crafting_bench', icon: 'bench', color: '#b07a3a' },
  cloudstone: { block: 'cloudstone' }, crystal: { block: 'crystal' }, sunstone: { block: 'sunstone' },
  sand: { block: 'sand' }, sandstone: { block: 'sandstone' }, snow: { block: 'snow' }, ice: { block: 'ice' },
  fungus: { block: 'fungus' }, obsidian: { block: 'obsidian' },
  // Food: food = hunger restored. Hold it and right-click to eat.
  apple:       { color: '#e53935', icon: 'lump', food: 4 },
  raw_fish:    { color: '#ff8a65', icon: 'fish', food: 3 },
  cooked_fish: { color: '#a1887f', icon: 'fish', food: 7 },
  // Dropped by enemies
  gel:      { color: '#66bb6a', icon: 'lump' },
  feather:  { color: '#f3e5f5', icon: 'lump' },
  jelly:    { color: '#f48fb1', icon: 'gem' },
  bat_wing: { color: '#9575cd', icon: 'lump' },
  silk:     { color: '#eeeeee', icon: 'lump' },
  claw:     { color: '#bcaaa4', icon: 'ingot' },
  scale:    { color: '#4dd0e1', icon: 'gem' },
  // durability = how many uses before a tool/weapon breaks
  // Swords: weapon = { damage, cooldown (frames between swings) }. Hold one and left-click an enemy.
  wood_sword:     { durability: 40, color: '#c8954f', weapon: { damage: 12, cooldown: 22 } },
  stone_sword:    { durability: 90, color: '#aaaaaa', weapon: { damage: 18, cooldown: 22 } },
  iron_sword:     { durability: 180, color: '#e8c4a0', weapon: { damage: 26, cooldown: 20 } },
  diamond_sword:  { durability: 450, color: '#40e0ff', weapon: { damage: 40, cooldown: 18 } },
  obsidian_sword: { durability: 700, color: '#5b3a8c', weapon: { damage: 55, cooldown: 18 } },
  mythril_sword:  { durability: 1100, color: '#b266ff', weapon: { damage: 75, cooldown: 15 } },
  // Axes: axe = how fast you chop wood/leaves (you only need one in your inventory). They also hit enemies.
  wood_axe:  { durability: 40, color: '#c8954f', axe: 4,  weapon: { damage: 8,  cooldown: 28 } },
  stone_axe: { durability: 90, color: '#aaaaaa', axe: 7,  weapon: { damage: 12, cooldown: 28 } },
  iron_axe:  { durability: 180, color: '#e8c4a0', axe: 10, weapon: { damage: 17, cooldown: 26 } },
  // heldLight = how far you can see while holding this item (in blocks)
  torch:  { block: 'torch', color: '#ffb300', icon: 'torch', heldLight: 14 },
  // icon: 'lump' | 'gem' | 'ingot' for materials (blocks and tools get icons automatically)
  coal:    { color: '#222222', icon: 'lump' },
  iron:    { color: '#d9a679', icon: 'ingot' },
  gold:    { color: '#ffd700', icon: 'ingot' },
  diamond: { color: '#40e0ff', icon: 'gem' },
  ruby:    { color: '#ff2255', icon: 'gem' },
  mythril: { color: '#b266ff', icon: 'gem' },
  // Pickaxes: 'color' is the head color
  wood_pickaxe:    { durability: 40, color: '#c8954f', tool: 2 },
  stone_pickaxe:   { durability: 90, color: '#aaaaaa', tool: 3.5 },
  iron_pickaxe:    { durability: 180, color: '#e8c4a0', tool: 6 },
  diamond_pickaxe: { durability: 450, color: '#40e0ff', tool: 9 },
  ruby_pickaxe:    { durability: 700, color: '#ff2255', tool: 13 },
  mythril_pickaxe: { durability: 1100, color: '#b266ff', tool: 18 },
};

// RECIPES: press E in game to craft. cost = what you pay, makes = what you get.
const RECIPES = [
  { makes: 'planks',        amount: 4, cost: { wood: 1 } },
  { makes: 'torch',         amount: 4, cost: { wood: 1, coal: 1 } },
  { makes: 'crafting_bench', amount: 1, cost: { planks: 6 } },
  { makes: 'torch',          amount: 8, cost: { wood: 1, gel: 1 } },
  { makes: 'cooked_fish',    amount: 1, cost: { raw_fish: 1, coal: 1 }, cat: ['Food'] },
  { makes: 'wood_pickaxe',  amount: 1, cost: { planks: 5 } },
  { makes: 'stone_pickaxe', amount: 1, cost: { planks: 3, stone: 6 } },
  { makes: 'iron_pickaxe',  amount: 1, cost: { planks: 3, iron: 6, coal: 2 } },
  { makes: 'diamond_pickaxe', amount: 1, cost: { planks: 3, diamond: 6, iron: 2 } },
  { makes: 'ruby_pickaxe',    amount: 1, cost: { planks: 3, ruby: 6, gold: 4 } },
  { makes: 'mythril_pickaxe', amount: 1, cost: { planks: 3, mythril: 6, diamond: 3 } },
  { makes: 'wood_sword',     amount: 1, cost: { planks: 6 } },
  { makes: 'stone_sword',    amount: 1, cost: { planks: 2, stone: 8 } },
  { makes: 'iron_sword',     amount: 1, cost: { planks: 2, iron: 8, coal: 2 } },
  { makes: 'diamond_sword',  amount: 1, cost: { planks: 2, diamond: 6 } },
  { makes: 'obsidian_sword', amount: 1, cost: { planks: 2, obsidian: 6, claw: 2 } },
  { makes: 'mythril_sword',  amount: 1, cost: { planks: 2, mythril: 6, scale: 3, silk: 2 } },
  { makes: 'wood_axe',       amount: 1, cost: { planks: 5 } },
  { makes: 'stone_axe',      amount: 1, cost: { planks: 3, stone: 5 } },
  { makes: 'iron_axe',       amount: 1, cost: { planks: 3, iron: 5 } },
  { makes: 'torch',          amount: 6, cost: { wood: 1, bat_wing: 1 } },
];

// BIOMES (above ground): top / sub = surface blocks, wall = background color of the dirt layer just under the surface.
const BIOMES = {
  forest: { name: 'Forest',      top: 'grass', sub: 'dirt', wall: '#4a3119' },
  desert: { name: 'Desert',      top: 'sand',  sub: 'sand', wall: '#8c7a45' },
  snow:   { name: 'Snow Tundra', top: 'snow',  sub: 'dirt', wall: '#53483f' },
  ocean:  { name: 'Ocean',       top: 'sand',  sub: 'sand', wall: '#8c7a45' },
};
// SKY ISLAND biomes (different from the ground biomes). top / body / under = the blocks of the island,
// deco = what decorates it ('blossoms' trees, crystal 'spires', 'pillars'), ore = [block, chance] hidden inside, haze = glow color (r,g,b)
const SKY_BIOMES = {
  meadow:  { name: 'Blossom Meadow', top: 'skygrass',   body: 'dirt',      under: 'cloudstone', deco: 'blossoms', ore: ['iron', 0.04],    haze: '255,214,232' },
  crystal: { name: 'Crystal Isle',   top: 'cloudstone', body: 'cloudstone', under: 'crystal',   deco: 'spires',   ore: ['diamond', 0.03], haze: '190,236,255' },
  ruins:   { name: 'Sun Ruins',      top: 'sunstone',   body: 'sunstone',  under: 'cloudstone', deco: 'pillars',  ore: ['gold', 0.05],    haze: '255,226,160' },
};
// UNDERGROUND biomes: fill = rock block, deep = rock below deepStoneDepth, patch = random extra blocks,
// wall / deepWall = background (cave wall) colors
const UNDER = {
  stone:  { name: 'Stone Caverns',   fill: 'stone',     deep: 'deepstone', wall: '#3b3b3b', deepWall: '#25252f' },
  ice:    { name: 'Ice Caverns',     fill: 'ice',       deep: 'ice',       wall: '#3d5a72', deepWall: '#2a4258' },        // under the snow
  sand:   { name: 'Sandstone Caves', fill: 'sandstone', deep: 'sandstone', wall: '#6e5a2e', deepWall: '#4d3f20' },        // under the desert
  fungal: { name: 'Fungal Grotto',   fill: 'stone',     deep: 'deepstone', patch: 'fungus', wall: '#3a2850', deepWall: '#261a38' },   // glowing mushrooms
};
const UNDER_KEYS = Object.keys(UNDER);

// ENEMIES: add your own! ai = 'fly' | 'crawl' (climbs walls) | 'hop' (jumps) | 'dig' (digs through rock) | 'swim' (water only)
// look = which drawing to use ('fly' 'crawl' 'hop' 'dig' 'swim' 'jelly'), hostile: false = harmless animal
// minDepth = how far underground it appears (negative = also on the surface). night = also appears on the surface at night.
// sky = only appears when you're up in the sky. ocean = only in the ocean. drops = item: [min, max]
const ENEMIES = {
  bat:       { name: 'Cave Bat',    ai: 'fly',   color: '#7e57c2', w: 0.9, h: 0.6, hp: 20, speed: 0.07,  damage: 8,  minDepth: 8,  night: true, drops: { bat_wing: [0, 2] } },
  spider:    { name: 'Cave Spider', ai: 'crawl', color: '#4e342e', w: 1.1, h: 0.7, hp: 35, speed: 0.06,  damage: 12, minDepth: 15, drops: { silk: [0, 2] } },

function hits(px, py) {

function syncSlots() {                             // keep slots in step with what you own (new items go in the first empty slot)

// Complicated recipes (tools & weapons) need a Crafting Bench nearby. Add  bench: true/false  to a recipe to override.

function recipeRow(i) {

function recipesHTML() {                           // recipes you've discovered, in collapsible groups

  if (Math.hypot(target.x - player.x, target.y + target.h / 2 - (player.y + 0.9)) > reach + 1) return false;
  target.hp -= debug.creative ? 999 : (wp ? wp.damage : CONFIG.fistDamage);

// ---------- Drawing ----------
let time = 0;

  const grey = Math.min(0.8, weather.dim * 1.6);

function draw() {

// ---------- Enemies ----------
const enemies = [];
let dayNow = 1;

    } else if (d.ai === 'crawl') {                 // spider: walks and climbs walls
      e.vy = Math.min(e.vy + CONFIG.gravity, 0.5);
      const mx = near ? Math.sign(dx) * sp : 0;
      if (e.hitX && near) e.vy = -sp * 1.8;
      else if (e.onGround && near && dy < -1.5 && Math.random() < 0.02) e.vy = -0.38;
      moveEnemy(e, mx + e.kx, e.vy);
      if (e.hitY) { e.onGround = e.vy > 0; e.vy = 0; } else e.onGround = false;
      e.face = Math.sign(mx) || e.face;
    } else if (d.ai === 'hop') {                   // slime: hops toward you
      e.vy = Math.min(e.vy + CONFIG.gravity, 0.5);
      if (e.onGround) { e.vx = 0; if (--e.cd <= 0 && near) { e.vy = -0.33; e.vx = Math.sign(dx) * sp * 2.2; e.cd = 40 + Math.random() * 40; } }
      moveEnemy(e, e.vx + e.kx, e.vy);
      if (e.hitY) { e.onGround = e.vy > 0; e.vy = 0; } else e.onGround = false;
      if (e.hitX) e.vx = 0;
      e.face = Math.sign(e.vx) || e.face;
    } else if (d.ai === 'dig') {                   // digger: can't walk through rock - it has to dig each block out
      const ux = near ? dx / dist : 0, uy = near ? dy / dist : 0;
      moveEnemy(e, ux * sp + e.kx, uy * sp);
      e.face = Math.sign(dx) || e.face;
      if ((e.hitX || e.hitY) && near) {
        const tx = Math.floor(e.hitX ? e.x + Math.sign(dx) * (e.w / 2 + 0.12) : e.x), ty = Math.floor(e.hitX ? e.y + e.h / 2 : e.y + (dy > 0 ? e.h + 0.12 : -0.12));
        const b = get(tx, ty);
        if (isSolid(tx, ty) && BLOCKS[b].hardness !== Infinity) {
          if (++e.digT >= Math.max(10, BLOCKS[b].hardness / 2.5)) { world[tx][ty] = 'air'; dropUnsupported(tx, ty); updateLight(tx, ty); e.digT = 0; }
        } else e.digT = 0;
      } else e.digT = 0;
    } else if (d.ai === 'swim') {                  // piranha / jellyfish / fish: stays in water
      const inW = (x, y) => get(Math.floor(x), Math.floor(y)) === 'water';
      let mx, my;
      if (near && inW(pcx, pcy)) { mx = dx / dist * sp; my = dy / dist * sp; }
      else { mx = Math.cos(e.seed + frame * 0.01) * sp * 0.6; my = Math.sin(e.seed * 2 + frame * 0.013) * sp * 0.4; }
      mx += e.kx;
      if (inW(e.x + mx + Math.sign(mx) * e.w / 2, e.y + e.h / 2) && !isSolid(Math.floor(e.x + mx), Math.floor(e.y + e.h / 2))) e.x += mx; else e.seed += 1.7;
      if (inW(e.x, e.y + e.h / 2 + my + Math.sign(my) * e.h / 2) && !isSolid(Math.floor(e.x), Math.floor(e.y + e.h / 2 + my))) e.y += my;
      if (!inW(e.x, e.y + e.h / 2)) e.hp -= 0.15;  // stranded out of water
      e.face = Math.sign(mx) || e.face;
    }
    if (d.hostile !== false && Math.abs(dx) < e.w / 2 + p.w / 2 && Math.abs(dy) < e.h / 2 + p.h / 2 && frame >= stats.hurtUntil) {   // touching you
      damage(e.dmg); stats.hurtUntil = frame + 50;
      p.kx = Math.sign(dx || 1) * 0.22; p.vy = -0.2; e.kx = -Math.sign(dx || 1) * 0.12;
    }
  }
}
function drawEnemies(cx, cy) {
  for (const e of enemies) {
    const d = ENEMIES[e.type], px = e.x * TS - cx, py = e.y * TS - cy, w = e.w * TS, h = e.h * TS, f = e.face, look = d.look || d.ai;
    if (px < -80 || px > canvas.width + 80 || py < -80 || py > canvas.height + 80) continue;
    ctx.fillStyle = ctx.strokeStyle = e.flash > 0 ? '#fff' : tintColor(d.color, e.tint);
    if (e.elite) { ctx.save(); ctx.strokeStyle = '#ffd54a'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(px, py + h / 2, Math.max(w, h) * 0.75, 0, 7); ctx.stroke(); ctx.restore(); }
    if (look === 'fly') {
      const flap = Math.sin(frame * 0.5) * h * 0.6;
      for (const s of [-1, 1]) { ctx.beginPath(); ctx.moveTo(px, py + h / 2); ctx.lineTo(px + s * w * 0.9, py + h / 2 - flap); ctx.lineTo(px + s * w * 0.3, py + h); ctx.fill(); }
      ctx.beginPath(); ctx.ellipse(px, py + h / 2, w * 0.28, h * 0.42, 0, 0, 7); ctx.fill();
    } else if (look === 'crawl') {
      ctx.lineWidth = 2;
      for (const s of [-1, 1]) for (let k = 0; k < 4; k++) { ctx.beginPath(); ctx.moveTo(px + s * w * 0.15, py + h * 0.5); ctx.lineTo(px + s * w * (0.35 + k * 0.1), py + h * (0.1 + k * 0.28) + Math.sin(frame * 0.3 + k) * 2); ctx.stroke(); }
      ctx.beginPath(); ctx.ellipse(px, py + h * 0.55, w * 0.32, h * 0.4, 0, 0, 7); ctx.fill();
    } else if (look === 'hop') {
      const sq = e.onGround ? 1 : 1.2;
      ctx.beginPath(); ctx.ellipse(px, py + h * 0.6, w * 0.5 / sq, h * 0.4 * sq, 0, Math.PI, 0); ctx.lineTo(px + w * 0.5 / sq, py + h); ctx.lineTo(px - w * 0.5 / sq, py + h); ctx.fill();
    } else if (look === 'dig') {
      ctx.fillRect(px - w / 2, py, w, h);
      ctx.fillStyle = e.flash > 0 ? '#fff' : '#cfd8dc'; ctx.beginPath(); ctx.moveTo(px + f * w / 2, py + h * 0.15); ctx.lineTo(px + f * w * 1.0, py + h / 2); ctx.lineTo(px + f * w / 2, py + h * 0.85); ctx.fill();
    } else if (look === 'jelly') {
      ctx.beginPath(); ctx.arc(px, py + h * 0.4, w * 0.45, Math.PI, 0); ctx.fill();
      ctx.lineWidth = 2; for (let k = -1; k <= 1; k++) { ctx.beginPath(); ctx.moveTo(px + k * w * 0.25, py + h * 0.4); ctx.lineTo(px + k * w * 0.25 + Math.sin(frame * 0.15 + k) * 3, py + h); ctx.stroke(); }
    } else {                                       // swim
      ctx.beginPath(); ctx.ellipse(px, py + h / 2, w * 0.4, h * 0.45, 0, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.moveTo(px - f * w * 0.3, py + h / 2); ctx.lineTo(px - f * w * 0.7, py); ctx.lineTo(px - f * w * 0.7, py + h); ctx.fill();
    }
    ctx.fillStyle = d.hostile === false ? '#111' : '#f33'; ctx.fillRect(px + f * w * 0.15 - 2, py + h * 0.3, 4, 4);
    if (e.hp < e.maxHp || e.elite) { ctx.fillStyle = '#000'; ctx.fillRect(px - 15, py - 9, 30, 5); ctx.fillStyle = e.elite ? '#ffd54a' : '#e53935'; ctx.fillRect(px - 14, py - 8, 28 * Math.max(0, e.hp / e.maxHp), 3); }
  }
}

// ---------- Debug menu (press ` to open) ----------
const debug = { creative: false, fly: false, noclip: false };

// Sliders in the menu. To add one, add a line: key = name in CONFIG, plus min / max / step.
// (apply = optional code to run when the value changes)
const DEBUG_SLIDERS = [
  { key: 'moveSpeed',       label: 'Walk speed',        min: 0.05, max: 0.6,  step: 0.01 },
  { key: 'sprintSpeed',     label: 'Sprint multiplier', min: 1,    max: 4,    step: 0.1 },
  { key: 'jumpPower',       label: 'Jump power',        min: 0.2,  max: 1,    step: 0.01 },
  { key: 'gravity',         label: 'Gravity',           min: 0,    max: 0.1,  step: 0.005 },
  { key: 'reach',           label: 'Reach (blocks)',    min: 2,    max: 40,   step: 1 },
  { key: 'dayLength',       label: 'Day length (sec)',  min: 20,   max: 1200, step: 10 },
  { key: 'nightBrightness', label: 'Night brightness',  min: 0,    max: 1,    step: 0.05 },
  { key: 'playerLight',     label: 'Player glow radius',min: 0,    max: 30,   step: 1 },
  { key: 'minLight',        label: 'Darkest light',     min: 0,    max: 0.5,  step: 0.01 },
  { key: 'flowEvery',       label: 'Water speed (frames per step, lower = faster)', min: 1, max: 30, step: 1 },
  { key: 'lavaFlowEvery',   label: 'Lava slowness (x slower than water)', min: 1, max: 10, step: 1 },
  { key: 'tileSize',        label: 'Zoom (tile size)',  min: 12,   max: 56,   step: 2, apply: v => TS = v },
];
// On/off switches for CONFIG values
const DEBUG_TOGGLES = [
  { key: 'lineOfSight',   label: 'Line-of-sight mining' },
  { key: 'dayNightCycle', label: 'Day/night cycle' },
];

const dbgEl = document.createElement('div'); dbgEl.id = 'debug'; document.body.appendChild(dbgEl);
let dbgOpen = false;
function toggleDebug() { dbgOpen = !dbgOpen; dbgEl.style.display = dbgOpen ? 'block' : 'none'; if (dbgOpen) buildDebug(); }
function buildDebug() {
  const row = h => `<div class="drow">${h}</div>`;
  let h = '<b>Debug menu</b> <small>(` to close)</small><div id="dinfo"></div><h4>Modes</h4>';
  for (const [k, label] of [['creative', 'Creative (infinite blocks, instant mining, god mode)'], ['fly', 'Fly (W/Space up, S down)'], ['noclip', 'Noclip (fly through walls)']])
    h += row(`<label><input type="checkbox" data-dbg="${k}" ${debug[k] ? 'checked' : ''}> ${label}</label>`);
  for (const t of DEBUG_TOGGLES) h += row(`<label><input type="checkbox" data-cfg="${t.key}" ${CONFIG[t.key] ? 'checked' : ''}> ${t.label}</label>`);
  h += '<h4>Items</h4>' + row(`<select id="dgive">${Object.keys(ITEMS).map(k => `<option>${k}</option>`).join('')}</select> <input id="dqty" type="number" value="64" min="1" style="width:56px"> <button data-act="give">Give</button>`);
  h += row('<button data-act="all">Give 999 of everything</button> <button data-act="clear">Clear inventory</button>');
  h += '<h4>Actions</h4>' + row('<button data-act="heal">Heal</button><button data-act="spawn">Go to spawn</button><button data-act="noon">Set noon</button><button data-act="midnight">Set midnight</button><button data-act="newworld">New world</button>') + row('Enemies: ' + Object.keys(ENEMIES).map(k => `<button data-act="spawn_${k}">${k}</button>`).join('') + '<button data-act="killall">Kill all</button>') + row('Elites: ' + Object.keys(ENEMIES).filter(k => ENEMIES[k].hostile !== false).map(k => `<button data-act="elite_${k}">${k}</button>`).join('')) + row('Weather: ' + Object.keys(WEATHER).map(k => `<button data-act="wx_${k}">${k}</button>`).join(''));
  h += '<h4>Settings</h4>';
  for (const d of DEBUG_SLIDERS) h += row(`${d.label}: <b id="v_${d.key}">${CONFIG[d.key]}</b><br><input type="range" data-slider="${d.key}" min="${d.min}" max="${d.max}" step="${d.step}" value="${CONFIG[d.key]}">`);
  dbgEl.innerHTML = h;
}
dbgEl.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.slider) {
    const d = DEBUG_SLIDERS.find(d => d.key === t.dataset.slider), v = +t.value;
    CONFIG[d.key] = v; if (d.apply) d.apply(v); document.getElementById('v_' + d.key).textContent = v;
  } else if (t.dataset.dbg) { debug[t.dataset.dbg] = t.checked; if (t.dataset.dbg === 'noclip' && t.checked) debug.fly = true; }
  else if (t.dataset.cfg) CONFIG[t.dataset.cfg] = t.checked;
});
dbgEl.addEventListener('change', e => { if (e.target.type !== 'number') e.target.blur(); });
addEventListener('click', e => { if (e.target.tagName === 'BUTTON') e.target.blur(); });   // so Space doesn't re-press a button
dbgEl.addEventListener('click', e => {
  const act = e.target.dataset.act; if (!act) return;
  if (act === 'give') add(document.getElementById('dgive').value, Math.max(1, +document.getElementById('dqty').value || 1));
  if (act === 'all') { for (const k of Object.keys(ITEMS)) inv[k] = (inv[k] || 0) + 999; refreshUI(); }
  if (act === 'clear') { for (const k of Object.keys(ITEMS)) inv[k] = 0; refreshUI(); }
  if (act === 'heal') { stats.health = CONFIG.maxHealth; stats.stamina = CONFIG.maxStamina; stats.oxygen = CONFIG.maxOxygen; stats.hunger = CONFIG.maxHunger; stats.exhausted = false; }
  if (act === 'spawn') Object.assign(player, { x: spawn.x, y: spawn.y, vx: 0, vy: 0, peakY: spawn.y });
  if (act === 'noon') timeOffset += 0 - (time % CONFIG.dayLength);
  if (act === 'midnight') timeOffset += CONFIG.dayLength / 2 - (time % CONFIG.dayLength);
  if (act === 'newworld') newWorld();
  if (act.startsWith('spawn_')) spawnForced(act.slice(6));
  if (act === 'killall') enemies.length = 0;
  if (act.startsWith('elite_')) spawnForced(act.slice(6), true);
  if (act.startsWith('wx_')) setWeather(act.slice(3));
});
function newWorld() {                              // makes a brand new random world
  for (let i = 0; i < ph.length; i++) ph[i] = rnd(0, 9);
  seed = Math.random() * 1e4;
  for (const t of [world, heights, biomeCol, ubc, light, glow, skyTop, fl]) for (const k in t) delete t[k];
  chunks.clear(); ensureChunks(0, true);
  spawn.x = 0.5; spawn.y = heights[0] - 3; enemies.length = 0; islands.length = 0; islandSeen.clear();
  Object.assign(player, { x: spawn.x, y: spawn.y, vx: 0, vy: 0, peakY: spawn.y });
}
let fpsAvg = 60, lastNow = performance.now();
function updateDebugInfo() {
  const now = performance.now(); fpsAvg += (1000 / Math.max(1, now - lastNow) - fpsAvg) * 0.05; lastNow = now;
  if (!dbgOpen || frame % 10) return;
  document.getElementById('dinfo').textContent = `x ${player.x.toFixed(1)}  y ${player.y.toFixed(1)}  depth ${Math.round(player.y - heights[Math.floor(player.x)])}  fps ${Math.round(fpsAvg)}`;
}

// ---------- Main loop ----------
const t0 = performance.now();
let timeOffset = 0;
function loop() { time = (performance.now() - t0) / 1000 + timeOffset; frame++; ensureChunks(player.x);
  if (frame % 15 === 0) { const nb = benchNear(); if (nb !== nearBench) { nearBench = nb; if (invOpen) refreshUI(); } }
  if (!invOpen) { updatePlayer(); updateHealth(); updateHunger(); updateWeather(); updateLiquids(); updateEnemies(); mine(); }   // the game pauses while the inventory is open
  draw(); drawWeather(); drawHud(); updateDebugInfo(); requestAnimationFrame(loop); }
refreshUI(); loop();
</script>
